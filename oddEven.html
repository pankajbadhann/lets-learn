<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Two Lists Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f4f4f4;
        }
        input, button {
            padding: 8px;
            margin: 5px 0;
            font-size: 16px;
        }
        .container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        .box {
            background: white;
            padding: 15px;
            border-radius: 5px;
            width: 100%;
        }
        textarea {
            width: 100%;
            height: 150px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<h2>Two Lists Generator</h2>

<label>Enter a positive integer:</label><br>
<input type="number" id="numberInput" min="1">
<br>
<button onclick="generateLists()">Generate</button>

<div class="container">
    <div class="box">
        <h3>List 1</h3>
        <textarea id="list1" readonly></textarea>
        <br>
        <button onclick="copyText('list1')">Copy List 1</button>
    </div>

    <div class="box">
        <h3>List 2</h3>
        <textarea id="list2" readonly></textarea>
        <br>
        <button onclick="copyText('list2')">Copy List 2</button>
    </div>
</div>

<script>
function generateLists() {
    const n = parseInt(document.getElementById("numberInput").value);
    let list1 = [];
    let list2 = [];

    for (let i = 1; i <= n; i++) {
        let mod = (i - 1) % 4;
        if (mod === 0 || mod === 1) {
            list1.push(i);
        } else {
            list2.push(i);
        }
    }

    document.getElementById("list1").value = list1.join(", ");
    document.getElementById("list2").value = list2.join(", ");
}

function copyText(id) {
    const textarea = document.getElementById(id);
    textarea.select();
    textarea.setSelectionRange(0, 999999);
    document.execCommand("copy");
    alert("Copied!");
}
</script>

</body>
</html>
